plugins {
    id "com.android.application"
}

android {
    namespace "dev.msgcrypt.app"
    compileSdk 35

    defaultConfig {
        applicationId "dev.msgcrypt.app"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    sourceSets {
        main.assets.srcDirs += ["../../protocol"]
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
        resources {
            excludes += ["META-INF/DEPENDENCIES", "META-INF/LICENSE*", "META-INF/NOTICE*"]
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.aar", "*.jar"])

    implementation "androidx.appcompat:appcompat:1.7.1"
    implementation "androidx.recyclerview:recyclerview:1.4.0"
    implementation "androidx.lifecycle:lifecycle-runtime:2.9.1"
    implementation "com.google.android.material:material:1.12.0"
    implementation "com.google.zxing:core:3.5.3"
    implementation "org.slf4j:slf4j-api:2.0.17"
    implementation "org.slf4j:slf4j-nop:2.0.17"

    implementation("it.tdlight:tdlight-java:3.5.5+td.1.8.66:jdk8") {
        exclude group: "it.tdlight", module: "tdlight-api"
    }
    implementation "it.tdlight:tdlight-api:4.0.562:legacy"

    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"

    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20250107"
}
