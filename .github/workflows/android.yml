name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "bridge/whatsmeow/**"
      - "protocol/**"
      - ".github/workflows/android.yml"
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache: false

      - name: Cache Go and WhatsMeow AAR
        id: whats-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            android/app/libs/whatsbridge.aar
          key: whatsapp-android-gomobile-4776eadac327-${{ hashFiles('bridge/whatsmeow/**') }}

      - name: Restore prebuilt Android TDLib
        id: tdlib-cache
        uses: actions/cache/restore@v4
        with:
          path: android/app/libs/tdlib.aar
          key: tdlib-android-1.8.66-022d602-b7e38f0270a72299005837d26858f623d67c8f0438211bdb7c1288ba1c67a699

      - name: Download prebuilt Android TDLib
        if: steps.tdlib-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p android/app/libs
          curl --fail --location --retry 3 \
            --output android/app/libs/tdlib.aar \
            https://github.com/FaiBah/TDLibAndroidPrebuilt/releases/download/v1.8.66-022d602-Java/tdlib.aar

      - name: Verify prebuilt Android TDLib
        shell: bash
        run: |
          echo "b7e38f0270a72299005837d26858f623d67c8f0438211bdb7c1288ba1c67a699  android/app/libs/tdlib.aar" | sha256sum --check --strict

      - name: Save prebuilt Android TDLib cache
        if: steps.tdlib-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: android/app/libs/tdlib.aar
          key: ${{ steps.tdlib-cache.outputs.cache-primary-key }}

      - name: Set up Android NDK
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" || test -d "$ANDROID_HOME/ndk/27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Build WhatsMeow Gomobile AAR
        if: steps.whats-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260821190718-4776eadac327
          gomobile init
          mkdir -p android/app/libs
          cd bridge/whatsmeow
          go get -tool golang.org/x/mobile/cmd/gobind@v0.0.0-20260821190718-4776eadac327
          gomobile bind -v -target=android -androidapi=26 -javapkg=dev.msgcrypt.bridge -o ../../android/app/libs/whatsbridge.aar .

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Test and build universal APK
        working-directory: android
        run: gradle --build-cache --stacktrace :app:testDebugUnitTest :app:assembleDebug

      - name: Verify APK contains native transports
        shell: bash
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -q 'classes'
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -q 'lib/arm64-v8a/libtdjni.so'
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -q 'lib/arm64-v8a/libgojni.so'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MsgCrypt-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
