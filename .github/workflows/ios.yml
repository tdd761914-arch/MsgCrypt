name: iOS unsigned IPA

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "bridge/whatsmeow/**"
      - "protocol/**"
      - ".github/workflows/ios.yml"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache: false

      - name: Cache Go and WhatsMeow XCFramework
        id: whats-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/Library/Caches/go-build
            ios/Frameworks/Whatsbridge.xcframework
          key: whatsapp-ios-gomobile-4776eadac327-${{ hashFiles('bridge/whatsmeow/**') }}

      - name: Build WhatsMeow Gomobile XCFramework
        if: steps.whats-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260821190718-4776eadac327
          gomobile init
          mkdir -p ios/Frameworks
          cd bridge/whatsmeow
          go get -tool golang.org/x/mobile/cmd/gobind@v0.0.0-20260821190718-4776eadac327
          gomobile bind -v -target=ios -o ../../ios/Frameworks/Whatsbridge.xcframework .

      - name: Save WhatsMeow XCFramework cache
        if: steps.whats-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/Library/Caches/go-build
            ios/Frameworks/Whatsbridge.xcframework
          key: ${{ steps.whats-cache.outputs.cache-primary-key }}

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Cache SwiftPM and prebuilt TDLibFramework
        id: swiftpm-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ios/build/DerivedData/SourcePackages
          key: swiftpm-tdlibframework-1.8.66-022d6020-${{ hashFiles('ios/project.yml') }}

      - name: Resolve prebuilt TDLibFramework
        working-directory: ios
        run: xcodebuild -resolvePackageDependencies -project MsgCrypt.xcodeproj -scheme MsgCrypt -derivedDataPath build/DerivedData

      - name: Save prebuilt TDLibFramework cache
        if: steps.swiftpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ios/build/DerivedData/SourcePackages
          key: ${{ steps.swiftpm-cache.outputs.cache-primary-key }}

      - name: Build unsigned device app
        working-directory: ios
        run: |
          xcodebuild \
            -project MsgCrypt.xcodeproj \
            -scheme MsgCrypt \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build

      - name: Package unsigned IPA
        working-directory: ios
        shell: bash
        run: |
          app_path=build/DerivedData/Build/Products/Release-iphoneos/MsgCrypt.app
          test -d "$app_path"
          mkdir -p build/ipa/Payload
          ditto "$app_path" build/ipa/Payload/MsgCrypt.app
          cd build/ipa
          zip -qry ../MsgCrypt-unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: MsgCrypt-iOS-unsigned
          path: ios/build/MsgCrypt-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
