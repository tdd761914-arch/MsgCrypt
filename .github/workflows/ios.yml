name: iOS unsigned IPA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache: false

      - name: Build WhatsMeow Gomobile XCFramework
        shell: bash
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init
          mkdir -p ios/Frameworks
          cd bridge/whatsmeow
          go get -tool golang.org/x/mobile/cmd/gobind@latest
          gomobile bind -v -target=ios -o ../../ios/Frameworks/Whatsbridge.xcframework .

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Resolve prebuilt TDLibFramework
        working-directory: ios
        run: xcodebuild -resolvePackageDependencies -project MsgCrypt.xcodeproj -scheme MsgCrypt

      - name: Build unsigned device app
        working-directory: ios
        run: |
          xcodebuild \
            -project MsgCrypt.xcodeproj \
            -scheme MsgCrypt \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build

      - name: Package unsigned IPA
        working-directory: ios
        shell: bash
        run: |
          app_path=build/DerivedData/Build/Products/Release-iphoneos/MsgCrypt.app
          test -d "$app_path"
          mkdir -p build/ipa/Payload
          ditto "$app_path" build/ipa/Payload/MsgCrypt.app
          cd build/ipa
          zip -qry ../MsgCrypt-unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: MsgCrypt-iOS-unsigned
          path: ios/build/MsgCrypt-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
